<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>civ</title>
<link rel="stylesheet" href="ui/style.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js", "three/addons/": "./vendor/"}}</script>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="The land"></div>

  <header id="top">
    <div class="pill" id="clock" aria-live="polite">Loading…</div>
    <div class="pill" id="headline"></div>
    <nav class="pill" id="worlds"></nav>
    <button class="pill" id="tvgo" aria-label="Watch it like television: it plays on its own">📺 TV</button>
    <button class="pill" id="viewswitch" aria-label="Switch between the 3D land and the map">Map</button>
  </header>

  <aside id="journal" aria-label="Journal">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="people" aria-selected="true">People</button>
      <button role="tab" data-tab="person" hidden>Person</button>
      <button role="tab" data-tab="knowledge">Knowledge</button>
      <button role="tab" data-tab="groups">Groups</button>
      <button role="tab" data-tab="places">Places</button>
      <button role="tab" data-tab="chronicle">Chronicle</button>
      <button role="tab" data-tab="measures">Measures</button>
      <button role="tab" data-tab="about">About</button>
      <button class="close" id="jclose" aria-label="Close the journal">×</button>
    </div>
    <div class="page" id="page"></div>
  </aside>
  <button class="pill" id="jopen" aria-label="Open the journal">Journal</button>

  <div id="pills">
    <button class="pill" id="back" hidden aria-label="Back to whom you follow (B)"></button>
    <button class="pill" id="newer" hidden>The world has gone on: see the newest</button>
  </div>
  <div id="card" class="sheet" hidden></div>
  <div id="story" class="story" hidden aria-live="polite"></div>
  <aside id="tvside" aria-live="polite"></aside>

  <footer id="bar">
    <button id="prev" class="pill" aria-label="Back to the last notable moment">⟨</button>
    <button id="play" class="round" aria-label="Play">▶</button>
    <button id="next" class="pill" aria-label="On to the next notable moment">⟩</button>
    <div id="track">
      <canvas id="marks" aria-hidden="true"></canvas>
      <input type="range" id="scrub" min="0" max="1" step="any" value="0" aria-label="Time">
    </div>
    <select id="speed" aria-label="Speed">
      <option value="story" selected>Story</option><option value="0.5">½ h/s</option><option value="1">1 h/s</option><option value="3">3 h/s</option>
      <option value="8">8 h/s</option><option value="24">1 day/s</option><option value="120">5 days/s</option>
    </select>
    <button id="now" class="pill">Now</button>
    <button id="resume" class="pill" hidden>Resume</button>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
