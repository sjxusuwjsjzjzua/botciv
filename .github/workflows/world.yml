# The living world. One run advances it for about five and a half hours in
# half-hour pieces (tools/advance.py), committing to the `world` branch and
# asking pages.yml to publish after each, so the free-tier quota is spent
# around the clock: Flash-Lite's daily allowance and every Gemma's per-minute
# allowance, whichever has room. Each run starts the next as it ends, and ends
# early (after a piece) when newer code reaches main, so new versions take over
# within the hour. Full prompts are kept as a run artifact.
# PAUSED since 2026-10-01: its free-tier capacity runs the third world (world3.yml, civ) so the
# second generation can be iterated in two worlds at once. No schedule; a run (its own chain
# included) does nothing unless started by hand with resume: true.
# Triggers: manual only. Never pull_request_target.
name: world
on:
  workflow_dispatch:
    inputs:
      resume:
        description: "Run the paused first world anyway"
        type: boolean
        default: false
      new_world:
        description: "End the current world and start a new one"
        type: boolean
        default: false
      minutes:
        description: "How long this run advances the world"
        default: "320"
permissions:
  contents: read
concurrency:
  group: world
  cancel-in-progress: false
jobs:
  advance:
    if: ${{ inputs.resume }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write          # to start the next world run and the Pages publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the world branch, or start it
        run: |
          if git fetch -q origin world:world; then
            git worktree add wb world
          else
            git worktree add --orphan -b world wb
          fi
      - name: Advance the world
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPI }}
          GROQ_API_KEY: ${{ secrets.Djxuzusjsnzja }}
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ inputs.new_world }}
          MINUTES: ${{ inputs.minutes || '320' }}
        run: |
          FLAGS=""
          if [ "$NEW" = "true" ]; then FLAGS="--new"; fi
          python tools/advance.py --worktree wb --minutes "$MINUTES" --prompts-out prompts-out --chain $FLAGS
      - name: Save anything left unsaved
        if: always()
        run: |
          cd wb
          rm -rf world/prompts
          git config user.name "botciv"
          git config user.email "botciv@users.noreply.github.com"
          git add world
          git commit -qm "$(head -1 world/last_run.md | sed 's/^## //')" || exit 0
          git push -q origin HEAD:world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompts-${{ github.run_id }}
          path: prompts-out
          retention-days: 30
          if-no-files-found: ignore
