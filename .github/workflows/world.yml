# The living world. Every hour it advances for up to 50 minutes, spending
# whatever free-tier quota is left (Flash-Lite first, then Gemma, whose daily
# allowance is far larger), writes the chronicle, commits the world to the
# `world` branch and publishes the viewer to GitHub Pages. The world runs ahead
# of anyone watching; the viewer plays the backlog at a human pace.
# Triggers: schedule and manual only. Never pull_request_target.
name: world
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      new_world:
        description: "End the current world and start a new one"
        type: boolean
        default: false
      max_calls:
        description: "Model calls this run may use"
        default: "3000"
      minutes:
        description: "Time limit for this run"
        default: "50"
permissions:
  contents: read
concurrency:
  group: world
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the world branch, or start it
        run: |
          if git fetch -q origin world:world; then
            git worktree add wb world
          else
            git worktree add --orphan -b world wb
          fi
      - name: Stand aside if a local runner holds the world
        id: lock
        run: |
          if [ -f wb/world/LOCK ] && [ "$(python3 -c 'import json,time;print(int(json.load(open("wb/world/LOCK"))["until"]>time.time()))')" = "1" ]; then
            echo "A local runner is advancing the world; only publishing." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Advance the world
        if: steps.lock.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPI }}
          NEW: ${{ inputs.new_world }}
          MAX_CALLS: ${{ inputs.max_calls || '3000' }}
          MINUTES: ${{ inputs.minutes || '50' }}
        run: |
          FLAGS=""
          if [ "$NEW" = "true" ]; then FLAGS="--new"; fi
          python -m botciv.run --dir wb/world --minutes "$MINUTES" --max-calls "$MAX_CALLS" $FLAGS
      - name: Build the viewer
        if: always()
        run: python -m botciv.site --dir wb/world --out site
      - name: Commit the world
        if: always() && steps.lock.outputs.skip != 'true'
        run: |
          cd wb
          git config user.name "botciv"
          git config user.email "botciv@users.noreply.github.com"
          git add world
          git commit -qm "$(head -1 world/last_run.md | sed 's/^## //')" || exit 0
          git push -q origin HEAD:world
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  publish:
    needs: advance
    if: always() && needs.advance.result != 'skipped'
    # Needs Settings > Pages > Source: GitHub Actions. Until then this job fails
    # harmlessly; the world itself is already saved on the world branch.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
