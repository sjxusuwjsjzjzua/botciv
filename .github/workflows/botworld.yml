# The long land: a bots-only civ world (no language model, no keys) that is never reset and runs as
# fast as it goes, to show where a land ends up when left alone for a long time under main's rules.
# Each run (tools/advance_long.py) advances it for about 35 minutes keeping only a census line a
# season (world/history.jsonl, the long record), then keeps the last 20 days hour by hour for the
# viewer (/botciv/long/), replaces the `botworld` branch with a single commit of the newest state
# (the branch never grows), asks Pages to publish, and starts the next run. Only this workflow writes
# the branch. Pause with the repository variable BOTS_OFF set to "yes" (as bots.yml). The hourly
# schedule is a backstop for a broken chain. Triggers: schedule and manual only. Never pull_request_target.
name: botworld
on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes of the fast part"
        default: "35"
permissions:
  contents: read
concurrency:
  group: botworld
  cancel-in-progress: false
jobs:
  advance:
    if: vars.BOTS_OFF != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write          # to ask Pages to publish and to start the next run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the long land's branch, or an empty one before it begins
        run: |
          if git fetch -q origin botworld:botworld; then
            git worktree add lw botworld
          else
            git worktree add --orphan -b botworld lw
          fi
      - name: Advance the long land
        env:
          MINUTES: ${{ inputs.minutes || '35' }}
        run: python tools/advance_long.py --worktree lw --minutes "$MINUTES" | tail -n 3
      - name: Publish, and start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run botworld.yml --ref main
