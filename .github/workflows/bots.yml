# The bot farm: bots-only civ worlds (no language model, no keys) run without end on spare Actions
# capacity, so every rules version on main is measured on many seeds rather than the three a session
# can afford. Each run has five shards. For about 40 minutes each starts worlds on fresh random seeds
# with tools/civ_balance.py: three on the balance land (120 people, 80 wide, 3 years, as sessions
# measure), one on the world2 land (200 people, 96 wide, 3 years), and one on long worlds (120 people,
# 12 years: housing, inheritance, ecology and knowledge only show over decades). One line per world is then
# appended to results/<rules>.jsonl on the `bots` branch, which only this workflow writes, and the
# run starts the next. tools/bot_stats.py reads it.
# To pause it, set the repository variable BOTS_OFF to "yes" (Settings > Secrets and variables >
# Actions > Variables); a run then does nothing and starts no other. The hourly schedule is a backstop
# for a broken chain. Triggers: schedule and manual only. Never pull_request_target.
name: bots
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes each shard starts worlds for"
        default: "40"
permissions:
  contents: read
concurrency:
  group: bots
  cancel-in-progress: false
jobs:
  shard:
    if: vars.BOTS_OFF != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: a, people: 120, size: 80, years: 3}
          - {name: b, people: 120, size: 80, years: 3}
          - {name: c, people: 120, size: 80, years: 3}
          - {name: d, people: 200, size: 96, years: 3}
          - {name: e, people: 120, size: 80, years: 12}     # long worlds: what only shows over decades
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bots-only worlds on fresh seeds
        env:
          MINUTES: ${{ inputs.minutes || '40' }}
          PEOPLE: ${{ matrix.people }}
          SIZE: ${{ matrix.size }}
          YEARS: ${{ matrix.years }}
        run: |
          python tools/civ_balance.py --random --minutes "$MINUTES" --years "$YEARS" --people "$PEOPLE" \
            --size "$SIZE" --json "worlds-${{ matrix.name }}.jsonl" | grep -E '^(seed|all)' || true
          test -s "worlds-${{ matrix.name }}.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worlds-${{ matrix.name }}
          path: worlds-${{ matrix.name }}.jsonl
          if-no-files-found: ignore
          retention-days: 3
  collect:
    needs: shard
    if: always() && vars.BOTS_OFF != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write          # to start the next run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: worlds-*
          path: got
          merge-multiple: true
      - name: Append the worlds to the bots branch
        id: keep
        run: |
          git config user.name botciv
          git config user.email botciv@users.noreply.github.com
          if git fetch -q origin bots:bots; then git worktree add bw bots; else git worktree add --orphan -b bots bw; fi
          mkdir -p bw/results
          python - <<'PY'
          import glob, json, os
          n = 0
          for f in glob.glob("got/*.jsonl"):
              for line in open(f):
                  try:
                      r = json.loads(line)
                  except ValueError:
                      continue
                  with open(os.path.join("bw/results", r["rules"] + ".jsonl"), "a") as out:
                      out.write(json.dumps(r) + "\n")
                  n += 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"worlds={n}\n")
          print(n, "worlds")
          PY
          cd bw
          git add -A results
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "bots: ${{ github.run_id }}"
          git push -q origin HEAD:bots
      - name: Start the next run
        if: steps.keep.outputs.worlds != '0' && steps.keep.outputs.worlds != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bots.yml --ref main
