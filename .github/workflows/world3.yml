# The third world: a civ land (civ/) of about 200 people, 16 of whom think with the free API
# tiers (Gemini Flash-Lite, Gemma, Groq; the capacity the first world used before it was paused),
# the rest bot people (16, not 48: the free tiers give about 150 answers an hour, so fewer minds each
# think more often and the land moves faster). It lives on the `world3` branch, which only this workflow writes. One run
# goes on for about five and a half hours in half-hour pieces (tools/advance_civ.py), committing
# and publishing after each, ends early when newer code reaches main, and starts the next run as
# it ends; the hourly schedule is only a backstop. The keys come from the repository secrets
# GEMINIAPI and Djxuzusjsnzja and are sent only as headers. Triggers: schedule and manual only.
# Never pull_request_target.
name: world3
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      new_world:
        description: "End the current world and begin a new one"
        type: boolean
        default: false
      minutes:
        description: "How long this run advances the world"
        default: "330"
permissions:
  contents: read
concurrency:
  group: world3
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write          # to start the next run and the Pages publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the third world's branch, or an empty one before it begins
        run: |
          if git fetch -q origin world3:world3; then
            git worktree add w3 world3
          else
            git worktree add --orphan -b world3 w3
          fi
      - name: Advance the third world
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPI }}
          GROQ_API_KEY: ${{ secrets.Djxuzusjsnzja }}
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ inputs.new_world }}
          MINUTES: ${{ inputs.minutes || '330' }}
        run: |
          FLAGS=""
          if [ "$NEW" = "true" ]; then FLAGS="--new"; fi
          python tools/advance_civ.py --worktree w3 --branch world3 --minutes "$MINUTES" --piece 30 --chain world3.yml --ai 16 $FLAGS
