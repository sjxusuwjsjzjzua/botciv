# Publishes the viewer from the `world` branch every hour, so the backlog on
# the site grows while a long world run is still going. Needs Settings > Pages >
# Source: GitHub Actions; until then the deploy fails harmlessly.
# Triggers: schedule and manual only. Never pull_request_target.
name: pages
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the world branch
        run: |
          git fetch -q origin world:world
          git worktree add wb world
      - name: Build the viewer
        run: python -m botciv.site --dir wb/world --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
