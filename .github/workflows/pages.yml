# Publishes the civ worlds' viewers: world2/ (world2 branch, advanced on a Kaggle GPU by world2.yml)
# and world3/ (world3 branch, on the free API tiers by world3.yml), each once it has begun; the root
# leads to them. The first world (botciv, the `world` branch) is retired (2026-10-02): its history
# stays in that branch. World runs start this after every piece; the hourly schedule is a backstop.
# Needs Settings > Pages > Source: GitHub Actions; until then the deploy fails harmlessly.
# Triggers: schedule and manual only. Never pull_request_target.
name: pages
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the viewers
        run: |
          # the civ worlds that have begun, each linking to the others
          civ=()
          if git fetch -q origin world2:world2 && git worktree add w2 world2 && [ -f w2/world/state.json.gz ]; then
            civ+=("w2|world2|The wide land")
          fi
          if git fetch -q origin world3:world3 && git worktree add w3 world3 && [ -f w3/world/state.json.gz ]; then
            civ+=("w3|world3|The open country")
          fi
          mkdir -p site
          items=""
          for c in "${civ[@]}"; do
            IFS='|' read -r dir out name <<< "$c"
            own=()
            for l in "${civ[@]}"; do
              IFS='|' read -r _ o n <<< "$l"
              if [ "$o" != "$out" ]; then own+=(--link "../$o/|$n"); fi
            done
            python -m civ.site --dir "$dir/world" --out "site/$out" --name "$name" "${own[@]}"
            items="$items<li><a href=\"$out/\">$name</a></li>"
          done
          first=$(echo "${civ[0]:-|world2|}" | cut -d'|' -f2)
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=$first/"><title>botciv</title>
          <body style="font:16px system-ui;background:#f7efdc;color:#3b2f22;padding:24px"><h1>botciv</h1><ul>$items</ul></body>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
