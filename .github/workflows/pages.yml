# Publishes the viewer and the ideas report from the `world` branch, and at
# large/ a hundred bots on a larger land under the current rules. World runs
# start it after every half-hour piece; the hourly schedule is a backstop. Needs Settings > Pages >
# Source: GitHub Actions; until then the deploy fails harmlessly.
# Triggers: schedule and manual only. Never pull_request_target.
name: pages
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  watchdog:
    # A world run that stops committing (a hang) holds every later run behind it until
    # its six-hour limit. If the world branch has not moved in 90 minutes while a world
    # run says it is running, cancel that run (its last save still happens) and start anew.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restart a world run that has gone quiet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin world || exit 0
          age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
          running=$(gh run list --workflow world.yml --status in_progress --json databaseId -q '.[0].databaseId')
          echo "world branch last moved ${age}s ago; running world run: ${running:-none}"
          if [ -n "$running" ] && [ "$age" -gt 5400 ]; then
            echo "The world has not moved in over 90 minutes; restarting its run." >> "$GITHUB_STEP_SUMMARY"
            gh run cancel "$running"
            sleep 60
            gh workflow run world.yml --ref main
          fi
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the world branch
        run: |
          git fetch -q origin world:world
          git worktree add wb world
      - name: Build the viewer and the ideas report
        run: |
          python -m botciv.site --dir wb/world --out site
          python tools/ideas.py --dir wb/world --out site/ideas.md
      - name: A hundred bots on a larger land, two years under the current rules (site/large/)
        run: |
          python -m botciv.run --dir botworld --config configs/large.toml --mind mixed --max-ticks 960 --new --seed 2
          python -m botciv.site --dir botworld --out site/large
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
